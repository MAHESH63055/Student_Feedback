<!DOCTYPE html>

<html>

<head>

    <title>Student Feedback</title>

</head>

<body>

<h1>Student Feedback Form</h1>

<form method="POST">

    {% csrf_token %}

    <label>Student Name:</label>

    <input
        type="text"
        name="student_name"
        required
    >

    <br><br>

    <label>Roll Number:</label>

    <input
        type="text"
        name="roll_number"
        required
    >

    <br><br>

    <label>Subject:</label>

    <select name="subject" required>

        <option value="">
            Select Subject
        </option>

        <option value="Python">
            Python
        </option>

        <option value="Django">
            Django
        </option>

        <option value="DBMS">
            DBMS
        </option>

        <option value="Operating Systems">
            Operating Systems
        </option>

    </select>

    <br><br>

    <label>Rating:</label>

    <select name="rating" required>

        <option value="1">
            1 - Very Poor
        </option>

        <option value="2">
            2 - Poor
        </option>

        <option value="3">
            3 - Average
        </option>

        <option value="4">
            4 - Good
        </option>

        <option value="5">
            5 - Excellent
        </option>

    </select>

    <br><br>

    <label>Comments:</label>

    <br>

    <textarea
        name="comments"
        rows="5"
        cols="40"
        required
    ></textarea>

    <br><br>

    <button type="submit">
        Submit Feedback
    </button>

</form>

</body>

</html>
